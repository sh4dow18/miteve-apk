name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble devDebug
        run: ./gradlew app:assembleDevDebug --stacktrace

      - name: Instrumented tests (emulador, permitido fallar sin emulador)
        id: instrumented
        continue-on-error: true
        run: ./gradlew app:connectedDevDebugAndroidTest --stacktrace

      - name: Aviso si tests instrumentados no corrieron
        if: steps.instrumented.outcome == 'failure'
        run: echo "⚠️ connectedDevDebugAndroidTest falló o no hay emulador. Revisar log; no bloquea el merge pero debe quedar registrado en el PR."

      - name: Lint
        run: ./gradlew app:lintDevDebug --stacktrace
